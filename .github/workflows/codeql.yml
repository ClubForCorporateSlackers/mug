# CodeQL（コードの脆弱性チェック）。
# このリポジトリは無料プランの非公開リポジトリなので、GitHub の Code scanning 画面には結果を送れない。
# 代わりに結果（SARIF）を Artifacts の codeql-results に残し、指摘が1件でもあれば失敗にする。
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # 毎週月曜 9:00（日本時間）

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL（${{ matrix.language }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: sarif-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-results-${{ matrix.language }}
          path: sarif-results
      - name: 指摘があれば失敗にする
        run: |
          count=$(jq '[.runs[].results[]] | length' sarif-results/*.sarif)
          echo "CodeQL の指摘：${count} 件"
          jq -r '.runs[].results[] | "- \(.ruleId): \(.message.text) (\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine))"' sarif-results/*.sarif
          test "$count" -eq 0
