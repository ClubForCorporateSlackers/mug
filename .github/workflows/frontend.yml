# フロント（frontend/）のCI。PR と main への push で動く
name: frontend

on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/frontend.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    name: 整形・lint・ビルド・Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build # 型チェック（tsc -b）も含む
      - run: npm run build-storybook -- --quiet
        env:
          STORYBOOK_DISABLE_TELEMETRY: 1

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # 設定は frontend/lighthouserc.json。結果は Artifacts の lighthouse からダウンロードして見る
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse
          path: frontend/.lighthouseci
          include-hidden-files: true

  # Cloudflare のボットがPRに書いたプレビューURLから、Storybook のURLを作ってコメントする
  storybook-url:
    name: StorybookのURLをコメント
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- storybook-url -->';
            // プレビューのビルドが終わるまで最大10分待つ
            let previewUrl;
            for (let i = 0; i < 20 && !previewUrl; i++) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
              const cf = comments.find((c) => c.body?.includes('Preview URL:') && !c.body.includes(marker));
              previewUrl = cf?.body.match(/Preview URL:\s*(https:\/\/\S+)/)?.[1];
              if (!previewUrl) await new Promise((r) => setTimeout(r, 30000));
            }
            if (!previewUrl) {
              core.warning('プレビューURLが見つかりませんでした');
              return;
            }
            const body = `${marker}\n### Storybook: ${previewUrl}/storybook/\n（プレビューのビルドが終わると最新になります）`;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
