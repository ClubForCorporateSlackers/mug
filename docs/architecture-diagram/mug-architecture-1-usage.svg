<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>mug の構成 1：利用するときの流れ</title>
  <style>
    text { font-family: 'Noto Sans JP', 'Yu Gothic UI', 'Yu Gothic', 'Meiryo', 'Hiragino Sans', sans-serif; fill: #111827; }
    .h1 { font-size: 44px; font-weight: 700; }
    .zone { font-size: 28px; font-weight: 700; }
    .name { font-size: 30px; font-weight: 700; text-anchor: middle; }
    .sub { font-size: 23px; text-anchor: middle; fill: #374151; }
    .left { font-size: 23px; fill: #374151; }
    .lb { font-size: 23px; font-weight: 700; stroke: #ffffff; stroke-width: 7px; paint-order: stroke; stroke-linejoin: round; }
    .note { font-size: 23px; fill: #374151; }
    .num { font-size: 27px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .flow { fill: none; stroke: #111827; stroke-width: 4; marker-end: url(#arrow); }
    .rel { fill: none; stroke: #9CA3AF; stroke-width: 3; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>

  <!-- タイトルと凡例 -->
  <text class="h1" x="40" y="80">mug の構成 1：利用するときの流れ</text>
  <line x1="1150" y1="66" x2="1230" y2="66" class="flow"/>
  <text class="left" x="1245" y="74" style="fill:#111827">リクエスト（番号は順番）</text>
  <line x1="1560" y1="66" x2="1630" y2="66" class="rel"/>
  <text class="left" x="1645" y="74">関係（キー・権限）</text>

  <!-- ブラウザ -->
  <rect x="40" y="170" width="220" height="600" rx="16" fill="#F3F4F6" stroke="#6B7280" stroke-width="3"/>
  <text class="sub" x="150" y="440">利用者</text>
  <text class="name" x="150" y="485" style="font-size:32px">ブラウザ</text>
  <text class="sub" x="150" y="525">スマホ・PC</text>

  <!-- Cloudflare -->
  <rect x="420" y="300" width="340" height="540" rx="20" fill="#FFF6EE" stroke="#F38020" stroke-width="3"/>
  <text class="zone" x="440" y="338" style="fill:#C2570C">Cloudflare</text>
  <rect x="450" y="360" width="280" height="450" rx="14" fill="#ffffff" stroke="#F38020" stroke-width="3"/>
  <text class="name" x="590" y="408">Worker「mug」</text>
  <text class="left" x="468" y="455">・画面ファイルの配信</text>
  <text class="left" x="468" y="490">・/api を署名付きで</text>
  <text class="left" x="468" y="522">　中継する</text>
  <rect x="470" y="650" width="240" height="64" rx="10" fill="#FFF6EE" stroke="#F38020" stroke-width="2"/>
  <text class="sub" x="590" y="690" style="fill:#111827">Secrets：AWS のキー</text>
  <rect x="470" y="728" width="240" height="60" rx="10" fill="#FFF6EE" stroke="#F38020" stroke-width="2"/>
  <text class="sub" x="590" y="766" style="fill:#111827">Workers Logs</text>

  <!-- AWS -->
  <rect x="800" y="130" width="1080" height="750" rx="20" fill="#F5F8FC" stroke="#1B4F8A" stroke-width="3"/>
  <text class="zone" x="825" y="172" style="fill:#1B4F8A">AWS（東京リージョン）</text>

  <rect x="1150" y="160" width="320" height="140" rx="14" fill="#ffffff" stroke="#1B4F8A" stroke-width="3"/>
  <text class="name" x="1310" y="210">Cognito</text>
  <text class="sub" x="1310" y="250">ログイン・</text>
  <text class="sub" x="1310" y="282">IDトークンの発行</text>

  <rect x="850" y="400" width="240" height="140" rx="14" fill="#ffffff" stroke="#1B4F8A" stroke-width="3"/>
  <text class="name" x="970" y="447">関数URL</text>
  <text class="sub" x="970" y="487">認証：AWS_IAM</text>
  <text class="sub" x="970" y="522">署名なしは 403</text>

  <rect x="1190" y="370" width="240" height="230" rx="14" fill="#ffffff" stroke="#1B4F8A" stroke-width="3"/>
  <text class="name" x="1310" y="418">Lambda</text>
  <text class="left" x="1210" y="460">API の処理</text>
  <text class="left" x="1210" y="496">・トークンの確認</text>
  <text class="left" x="1210" y="532">・位置のぼかし</text>
  <text class="left" x="1210" y="568">・DB の読み書き</text>

  <rect x="1530" y="360" width="330" height="470" rx="14" fill="#ffffff" stroke="#1B4F8A" stroke-width="3"/>
  <text class="name" x="1695" y="405">DynamoDB</text>
  <text class="sub" x="1695" y="440">5つのテーブル</text>
  <g class="sub">
    <rect x="1555" y="460" width="280" height="50" rx="8" fill="#EAF1FA" stroke="#1B4F8A" stroke-width="2"/>
    <text class="sub" x="1695" y="494" style="fill:#111827">Users</text>
    <rect x="1555" y="520" width="280" height="50" rx="8" fill="#EAF1FA" stroke="#1B4F8A" stroke-width="2"/>
    <text class="sub" x="1695" y="554" style="fill:#111827">Pins</text>
    <rect x="1590" y="578" width="245" height="44" rx="8" fill="#ffffff" stroke="#1B4F8A" stroke-width="2"/>
    <text class="sub" x="1712" y="609">└ 索引 byUser</text>
    <rect x="1555" y="632" width="280" height="50" rx="8" fill="#EAF1FA" stroke="#1B4F8A" stroke-width="2"/>
    <text class="sub" x="1695" y="666" style="fill:#111827">Comments</text>
    <rect x="1555" y="692" width="280" height="50" rx="8" fill="#EAF1FA" stroke="#1B4F8A" stroke-width="2"/>
    <text class="sub" x="1695" y="726" style="fill:#111827">Reactions</text>
    <rect x="1555" y="752" width="280" height="50" rx="8" fill="#EAF1FA" stroke="#1B4F8A" stroke-width="2"/>
    <text class="sub" x="1695" y="786" style="fill:#111827">Rankings</text>
  </g>

  <rect x="850" y="700" width="240" height="150" rx="14" fill="#ffffff" stroke="#1B4F8A" stroke-width="3"/>
  <text class="name" x="970" y="745" style="font-size:28px">IAM ユーザー</text>
  <text class="sub" x="970" y="785">Worker 用のキー</text>
  <text class="sub" x="970" y="820">関数URLを呼ぶだけ</text>

  <rect x="1190" y="700" width="240" height="130" rx="14" fill="#ffffff" stroke="#1B4F8A" stroke-width="3"/>
  <text class="name" x="1310" y="752" style="font-size:28px">CloudWatch</text>
  <text class="name" x="1310" y="790" style="font-size:28px">Logs</text>

  <!-- 外部サービス -->
  <rect x="430" y="920" width="300" height="120" rx="14" fill="#F3F4F6" stroke="#6B7280" stroke-width="3"/>
  <text class="name" x="580" y="968">OpenFreeMap</text>
  <text class="sub" x="580" y="1008">地図（外部サービス）</text>

  <rect x="1530" y="920" width="330" height="120" rx="14" fill="#F3F4F6" stroke="#6B7280" stroke-width="3"/>
  <text class="name" x="1695" y="968">国土地理院 API</text>
  <text class="sub" x="1695" y="1008">緯度経度 → 市町村</text>

  <!-- 関係（灰色の細線） -->
  <path class="rel" d="M710,682 H780 V775 H850"/>
  <path class="rel" d="M970,700 V540"/>

  <!-- 流れ（実線） -->
  <!-- ① 画面ファイル -->
  <line class="flow" x1="260" y1="440" x2="448" y2="440"/>
  <!-- ② 地図 -->
  <path class="flow" d="M150,770 V980 H428"/>
  <!-- ③ ログイン -->
  <line class="flow" x1="260" y1="225" x2="1148" y2="225"/>
  <!-- ④ /api -->
  <line class="flow" x1="260" y1="600" x2="448" y2="600"/>
  <!-- ⑤ 署名付きで中継 -->
  <line class="flow" x1="730" y1="470" x2="848" y2="470"/>
  <!-- ⑥ 起動 -->
  <line class="flow" x1="1090" y1="470" x2="1188" y2="470"/>
  <!-- ⑦ トークンを確認 -->
  <line class="flow" x1="1310" y1="370" x2="1310" y2="302"/>
  <!-- ⑧ 市町村 -->
  <path class="flow" d="M1430,580 H1490 V980 H1528"/>
  <!-- ⑨ 読み書き -->
  <line class="flow" x1="1430" y1="470" x2="1528" y2="470"/>
  <!-- ⑩ ログ -->
  <line class="flow" x1="1310" y1="600" x2="1310" y2="698"/>

  <!-- 番号と説明 -->
  <g>
    <circle cx="300" cy="440" r="22" fill="#111827"/><text class="num" x="300" y="449">1</text>
    <text class="lb" x="272" y="482">画面ファイル</text>

    <circle cx="150" cy="870" r="22" fill="#111827"/><text class="num" x="150" y="879">2</text>
    <text class="lb" x="182" y="878">地図を取る</text>

    <circle cx="300" cy="225" r="22" fill="#111827"/><text class="num" x="300" y="234">3</text>
    <text class="lb" x="335" y="208">ログインして IDトークンを受け取る</text>

    <circle cx="300" cy="600" r="22" fill="#111827"/><text class="num" x="300" y="609">4</text>
    <text class="lb" x="272" y="642">/api/* を呼ぶ</text>
    <text class="lb" x="272" y="672">トークン付き</text>

    <circle cx="780" cy="470" r="22" fill="#111827"/><text class="num" x="780" y="479">5</text>
    <text class="lb" x="740" y="512">署名付き</text>

    <circle cx="1140" cy="470" r="22" fill="#111827"/><text class="num" x="1140" y="479">6</text>
    <text class="lb" x="1140" y="512" style="text-anchor:middle">起動</text>

    <circle cx="1310" cy="336" r="22" fill="#111827"/><text class="num" x="1310" y="345">7</text>
    <text class="lb" x="1280" y="344" style="text-anchor:end">トークンを確認</text>

    <circle cx="1490" cy="900" r="22" fill="#111827"/><text class="num" x="1490" y="909">8</text>

    <circle cx="1480" cy="470" r="22" fill="#111827"/><text class="num" x="1480" y="479">9</text>
    <text class="lb" x="1480" y="512" style="text-anchor:middle">読み書き</text>

    <circle cx="1310" cy="650" r="22" fill="#111827"/><text class="num" x="1310" y="658" style="font-size:22px">10</text>
    <text class="lb" x="1342" y="658">ログ</text>
  </g>

  <!-- 補足 -->
  <text class="note" x="790" y="955">※ 応答は、同じ道を逆にたどって戻る</text>
  <text class="note" x="790" y="992">※ ⑧ はピンを立てるときだけ</text>
  <text class="note" x="790" y="1029">※ ② と ③ は、ブラウザから直接（Worker を通らない）</text>
</svg>
