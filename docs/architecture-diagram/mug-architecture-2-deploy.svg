<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <title>mug の構成 2：開発・デプロイの流れ</title>
  <style>
    text { font-family: 'Noto Sans JP', 'Yu Gothic UI', 'Yu Gothic', 'Meiryo', 'Hiragino Sans', sans-serif; fill: #111827; }
    .h1 { font-size: 44px; font-weight: 700; }
    .zone { font-size: 28px; font-weight: 700; }
    .name { font-size: 30px; font-weight: 700; text-anchor: middle; }
    .sub { font-size: 23px; text-anchor: middle; fill: #374151; }
    .left { font-size: 23px; fill: #374151; }
    .lb { font-size: 23px; font-weight: 700; stroke: #ffffff; stroke-width: 7px; paint-order: stroke; stroke-linejoin: round; }
    .note { font-size: 23px; fill: #374151; }
    .num { font-size: 27px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .flow { fill: none; stroke: #111827; stroke-width: 4; stroke-dasharray: 14 9; marker-end: url(#arrow); }
    .rel { fill: none; stroke: #9CA3AF; stroke-width: 3; }
    .chip { fill: #EAF1FA; stroke: #1B4F8A; stroke-width: 2; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111827"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>

  <!-- タイトルと凡例 -->
  <text class="h1" x="40" y="80">mug の構成 2：開発・デプロイの流れ</text>
  <line x1="1150" y1="66" x2="1230" y2="66" class="flow"/>
  <text class="left" x="1245" y="74" style="fill:#111827">開発・デプロイ（記号は順番）</text>
  <line x1="1600" y1="66" x2="1660" y2="66" class="rel"/>
  <text class="left" x="1675" y="74">関係（権限）</text>

  <!-- 開発者 -->
  <rect x="40" y="170" width="220" height="790" rx="16" fill="#F3F4F6" stroke="#6B7280" stroke-width="3"/>
  <text class="name" x="150" y="555" style="font-size:32px">開発者</text>
  <text class="sub" x="150" y="595">（自分の PC）</text>

  <!-- GitHub -->
  <rect x="360" y="130" width="360" height="405" rx="20" fill="#F6F8FA" stroke="#24292F" stroke-width="3"/>
  <text class="zone" x="380" y="170">GitHub</text>
  <rect x="390" y="190" width="300" height="110" rx="14" fill="#ffffff" stroke="#24292F" stroke-width="3"/>
  <text class="name" x="540" y="240">リポジトリ</text>
  <text class="sub" x="540" y="278">main ブランチ</text>
  <rect x="380" y="350" width="320" height="170" rx="14" fill="#ffffff" stroke="#24292F" stroke-width="3"/>
  <text class="name" x="540" y="395" style="font-size:28px">GitHub Actions</text>
  <text class="sub" x="540" y="433" style="fill:#111827;font-weight:700">確認だけ・デプロイはしない</text>
  <text class="sub" x="540" y="468">整形・lint・ビルド</text>
  <text class="sub" x="540" y="502">Lighthouse・CodeQL</text>

  <!-- Cloudflare -->
  <rect x="820" y="130" width="1060" height="290" rx="20" fill="#FFF6EE" stroke="#F38020" stroke-width="3"/>
  <text class="zone" x="840" y="170" style="fill:#C2570C">Cloudflare</text>
  <rect x="860" y="190" width="440" height="200" rx="14" fill="#ffffff" stroke="#F38020" stroke-width="3"/>
  <text class="name" x="1080" y="238">Workers Builds</text>
  <text class="sub" x="1080" y="280">フロントをビルドして</text>
  <text class="sub" x="1080" y="313">Worker をデプロイ</text>
  <text class="sub" x="1080" y="358">（Cloudflare の GitHub アプリで連携）</text>
  <rect x="1460" y="190" width="380" height="200" rx="14" fill="#ffffff" stroke="#F38020" stroke-width="3"/>
  <text class="name" x="1650" y="250">Worker「mug」</text>
  <text class="sub" x="1650" y="295">画面ファイル＋/api の中継</text>
  <text class="sub" x="1650" y="333">（本番）</text>

  <!-- AWS -->
  <rect x="820" y="620" width="1060" height="430" rx="20" fill="#F5F8FC" stroke="#1B4F8A" stroke-width="3"/>
  <text class="zone" x="840" y="662" style="fill:#1B4F8A">AWS（東京リージョン）</text>

  <rect x="860" y="685" width="360" height="110" rx="14" fill="#ffffff" stroke="#1B4F8A" stroke-width="3"/>
  <text class="name" x="1040" y="730" style="font-size:28px">IAM ユーザー（開発者用）</text>
  <text class="sub" x="1040" y="770">MFA 付き・aws login</text>

  <rect x="860" y="825" width="360" height="105" rx="14" fill="#ffffff" stroke="#1B4F8A" stroke-width="3"/>
  <text class="name" x="1040" y="868" style="font-size:28px">CloudFormation</text>
  <text class="sub" x="1040" y="906">スタックを作る・更新する</text>

  <rect x="860" y="950" width="360" height="85" rx="14" fill="#ffffff" stroke="#1B4F8A" stroke-width="3"/>
  <text class="name" x="1040" y="986" style="font-size:26px">S3（CDK の置き場）</text>
  <text class="sub" x="1040" y="1020">Lambda のコードなど</text>

  <rect x="1500" y="640" width="350" height="100" rx="14" fill="#ffffff" stroke="#1B4F8A" stroke-width="3"/>
  <text class="name" x="1675" y="682" style="font-size:28px">AWS Budgets</text>
  <text class="sub" x="1675" y="720">使った金額を見張る</text>

  <rect x="1300" y="765" width="550" height="270" rx="14" fill="#ffffff" stroke="#1B4F8A" stroke-width="3"/>
  <text class="name" x="1575" y="805" style="font-size:26px">CDK で作るもの</text>
  <rect class="chip" x="1320" y="825" width="250" height="56" rx="8"/>
  <text class="sub" x="1445" y="861" style="fill:#111827">関数URL・Lambda</text>
  <rect class="chip" x="1580" y="825" width="250" height="56" rx="8"/>
  <text class="sub" x="1705" y="861" style="fill:#111827">DynamoDB</text>
  <rect class="chip" x="1320" y="891" width="250" height="56" rx="8"/>
  <text class="sub" x="1445" y="927" style="fill:#111827">Cognito</text>
  <rect class="chip" x="1580" y="891" width="250" height="56" rx="8"/>
  <text class="sub" x="1705" y="927" style="fill:#111827">CloudWatch Logs</text>
  <rect class="chip" x="1320" y="957" width="510" height="56" rx="8"/>
  <text class="sub" x="1575" y="993" style="fill:#111827">IAM ユーザー（Worker 用）</text>

  <!-- CDK（開発者の PC で動く） -->
  <rect x="390" y="690" width="300" height="220" rx="14" fill="#ffffff" stroke="#6B7280" stroke-width="3"/>
  <text class="name" x="540" y="740">CDK</text>
  <text class="sub" x="540" y="780">AWS の構成を</text>
  <text class="sub" x="540" y="812">TypeScript で書く</text>
  <text class="sub" x="540" y="855">開発者の PC で実行</text>

  <!-- 関係（灰色の細線） -->
  <line class="rel" x1="690" y1="740" x2="860" y2="740"/>
  <text class="lb" x="755" y="698" style="text-anchor:middle;font-weight:400;fill:#374151">この権限</text><text class="lb" x="755" y="726" style="text-anchor:middle;font-weight:400;fill:#374151">で実行</text>

  <!-- 流れ（点線） -->
  <!-- A push・PR・マージ -->
  <line class="flow" x1="260" y1="245" x2="388" y2="245"/>
  <!-- B 確認 -->
  <line class="flow" x1="540" y1="300" x2="540" y2="348"/>
  <!-- C main へのマージでデプロイ -->
  <line class="flow" x1="690" y1="245" x2="858" y2="245"/>
  <line class="flow" x1="1300" y1="290" x2="1458" y2="290"/>
  <!-- D cdk deploy -->
  <line class="flow" x1="260" y1="800" x2="388" y2="800"/>
  <line class="flow" x1="690" y1="870" x2="858" y2="870"/>
  <path class="flow" d="M540,910 V992 H858"/>
  <line class="flow" x1="1220" y1="880" x2="1298" y2="880"/>
  <!-- E 予算の通知 -->
  <path class="flow" d="M1675,640 V570 H262"/>

  <!-- 記号と説明 -->
  <g>
    <circle cx="320" cy="245" r="22" fill="#111827"/><text class="num" x="320" y="254">A</text>
    <text class="lb" x="320" y="290" style="text-anchor:middle">push・PR</text>
    <text class="lb" x="320" y="320" style="text-anchor:middle">マージ</text>

    <circle cx="540" cy="325" r="22" fill="#111827"/><text class="num" x="540" y="334">B</text>
    <text class="lb" x="572" y="334">PR・push</text>

    <circle cx="775" cy="245" r="22" fill="#111827"/><text class="num" x="775" y="254">C</text>
    <text class="lb" x="775" y="290" style="text-anchor:middle">main への</text>
    <text class="lb" x="775" y="320" style="text-anchor:middle">マージ</text>
    <text class="lb" x="1380" y="330" style="text-anchor:middle">デプロイ</text>

    <circle cx="320" cy="800" r="22" fill="#111827"/><text class="num" x="320" y="809">D</text>
    <text class="lb" x="320" y="845" style="text-anchor:middle">cdk</text>
    <text class="lb" x="320" y="875" style="text-anchor:middle">deploy</text>
    <text class="lb" x="755" y="905" style="text-anchor:middle">構成を</text><text class="lb" x="755" y="935" style="text-anchor:middle">渡す</text>
    <text class="lb" x="565" y="980">コードを置く</text>
    <text class="lb" x="1260" y="925" style="text-anchor:middle">作る</text>

    <circle cx="1000" cy="570" r="22" fill="#111827"/><text class="num" x="1000" y="579">E</text>
    <text class="lb" x="1035" y="556">予算を超えたらメールで通知</text>
  </g>

  <!-- 補足 -->
  <text class="note" x="840" y="462">※ Worker のデプロイは、main へのマージのときだけ</text>
  <text class="note" x="840" y="498">※ AWS のデプロイ（D）は手で行う（GitHub からは動かない）</text>
</svg>
